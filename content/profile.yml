# Who you are. Edit any line here and the whole site updates on the next build.
name: Vinod Bijlani
title: Distinguished Technologist and AI Practice Leader, Asia Pacific
company: Hewlett Packard Enterprise
location: Melbourne, Australia
photo: assets/img/vinod.webp
career_start: 1998
ai_since: 2008  # building AI solutions since; shown on Experience and Patents

headline: I architect and build sovereign AI factories that give enterprises and nations control over their data, their models and their future.

kicker: Distinguished Technologist · AI factories · Sovereign AI · Inventor

bio:
  - For more than a decade I worked on smarter cities, designing intelligent transport, traffic and building systems in India, Singapore and the USA. Today I lead the AI practice for Hewlett Packard Enterprise across Asia Pacific, helping enterprises and governments move AI from pilots to governed, production-scale platforms.
  - My work sits where infrastructure, economics and governance meet. I write about AI factories, token economics and sovereign AI for the Forbes Technology Council, where I also lead the Quantum Computing Group, and I co-authored Own Your AI, a playbook for building AI under your own legal, operational and technical control.
  - I am a Distinguished Technologist at HPE, an IBM Master Inventor with 25 patents in AI, analytics and transport, and an Open Group Distinguished Architect.

topics:
  - Sovereign AI factories
  - Agentic AI at enterprise scale
  - Tokenomics and datanomics
  - Hybrid AI workload placement
  - AI governance and security
  - AI data centre economics
  - Smart cities and intelligent transport

